name: Monitor de citas DIAN

# v6.1. Cada corrida vigila en bucle (una revision cada ~3 minutos entre las
# 5:00 y las 21:00 de Bogota; de noche solo espera) durante casi 6 horas, el
# maximo que GitHub deja a un job. Al terminar, se relanza ella misma. Asi la
# vigilancia es continua y NO depende del cron de GitHub, que en este
# repositorio no estaba disparando.
#
# El cron queda solo de respaldo: si la cadena se corta (una caida de GitHub,
# por ejemplo) la vuelve a arrancar en la hora siguiente. Va en UTC.
#
# Para apagarlo: cancelar la corrida en curso (una corrida cancelada no se
# relanza) o desactivar el workflow en la pestana Actions.
#
# Las corridas "canceladas" que aparezcan solas son las que el cron mete en cola
# mientras hay otra activa: es normal.

on:
  schedule:
    - cron: "9 * * * *"
  workflow_dispatch:        # boton "Run workflow" para arrancar ya
    inputs:
      probar_avisos:
        description: "Solo mandar un aviso de prueba a todos los canales (sin vigilar)"
        type: boolean
        default: false

concurrency:
  group: dian-monitor
  cancel-in-progress: false

permissions:
  contents: write           # keepalive y rama "resultados"
  actions: write            # para relanzarse al terminar

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TZ: America/Bogota
      DIAN_MODALIDAD: ambas
      DIAN_INTERVALO_SEG: "180"
      DIAN_HORA_INICIO: "5"
      DIAN_HORA_FIN: "21"
      # Avisos: cada canal es opcional; el que no tenga sus secretos, no se usa.
      DIAN_NTFY_TOPIC: ${{ secrets.DIAN_NTFY_TOPIC }}
      DIAN_TELEGRAM_TOKEN: ${{ secrets.DIAN_TELEGRAM_TOKEN }}
      DIAN_TELEGRAM_CHAT_ID: ${{ secrets.DIAN_TELEGRAM_CHAT_ID }}
      DIAN_TWILIO_SID: ${{ secrets.DIAN_TWILIO_SID }}
      DIAN_TWILIO_TOKEN: ${{ secrets.DIAN_TWILIO_TOKEN }}
      DIAN_TWILIO_FROM: ${{ secrets.DIAN_TWILIO_FROM }}
      DIAN_TWILIO_TO: ${{ secrets.DIAN_TWILIO_TO }}
      DIAN_WHATSAPP_PHONE: ${{ secrets.DIAN_WHATSAPP_PHONE }}
      DIAN_WHATSAPP_APIKEY: ${{ secrets.DIAN_WHATSAPP_APIKEY }}
      DIAN_CORREO_DESTINO: ${{ secrets.DIAN_CORREO_DESTINO }}
      DIAN_CORREO_ORIGEN: ${{ secrets.DIAN_CORREO_ORIGEN }}
      DIAN_CLAVE_APP: ${{ secrets.DIAN_CLAVE_APP }}

    steps:
      - name: Marca de inicio
        run: echo "INICIO_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar Playwright
        run: pip install -r requirements.txt

      # Chromium pesa ~314 MB. La clave lleva la version de Playwright, asi que
      # al subir de version el cache se invalida solo.
      - name: Cache de Chromium
        id: cache-chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Bajar Chromium
        if: steps.cache-chromium.outputs.cache-hit != 'true'
        run: playwright install --with-deps --only-shell chromium

      - name: Librerias del sistema
        if: steps.cache-chromium.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Probar avisos
        if: ${{ inputs.probar_avisos }}
        run: python check_dian_v5.py --test-avisos

      - name: Vigilar
        id: vigilar
        if: ${{ !inputs.probar_avisos }}
        run: |
          set +e
          python check_dian_v5.py --vigilar --duracion-min 340
          codigo=$?
          set -e
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          # 0 = termino bien (con o sin cupos). 2 = ninguna revision pudo leer
          # la pagina: solo eso marca la corrida en rojo.
          if [ "$codigo" != "0" ]; then
            echo "::error::ninguna revision pudo leer la pagina (codigo $codigo)"
            exit 1
          fi

      # Capturas, y el HTML de la pantalla de cupos si los hubo: con ese HTML se
      # puede automatizar el resto del agendamiento.
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salida-${{ github.run_number }}
          path: |
            salida/*.png
            salida/*.html
            salida/resumen.json
            monitor.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Resumen
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("salida/resumen.json")
          r = json.loads(p.read_text()) if p.exists() else {}
          titulo = "**HAY CUPOS**, revisa el celular" if r.get("hay_cupos") else (
              "Sin cupos" if r.get("revisiones") else "No se reviso (fuera de horario o error al arrancar)")
          print(f"## {titulo}\n")
          print("| | |\n|---|---|")
          for k in ("inicio", "actualizado", "revisiones", "sin_cupos", "hay_cupos", "error"):
              print(f"| {k} | {r.get(k, '-')} |")
          print("\nCapturas y registro en **Artifacts**, al pie de esta pagina.")
          PY

      # GitHub apaga los workflows programados tras 60 dias sin actividad. Un
      # commit al mes reinicia el contador. Va antes de publicar la captura,
      # porque ese paso cambia de rama.
      - name: Keepalive (dia 1 de cada mes)
        if: always()
        run: |
          if [ "$(date +%d)" != "01" ]; then exit 0; fi
          git checkout -- . 2>/dev/null || true
          echo "$(date -u +%Y-%m-%d)" > .github/latido
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latido
          git diff --staged --quiet || { git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"; git push; }

      # Ultima captura en la rama "resultados", que se abre en el navegador:
      #   https://github.com/OdobGames/monitor-dian/tree/resultados
      - name: Publicar ultima captura
        if: always()
        run: |
          [ -f salida/resultado.png ] || exit 0
          cp salida/resultado.png /tmp/resultado.png
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan resultados
          git rm -rf --cached . >/dev/null
          rm -rf salida
          mkdir -p ultima
          cp /tmp/resultado.png ultima/resultado.png
          printf '# Ultima revision\n\n%s (hora de Bogota)\n\n![resultado](ultima/resultado.png)\n' \
            "$(TZ=America/Bogota date '+%Y-%m-%d %H:%M:%S')" > README.md
          # -f: el .gitignore excluye *.png y sin esto la captura nunca se publicaba
          git add -f ultima/resultado.png README.md
          git commit -q -m "Ultima revision"
          git push -f origin resultados

      # Se relanza al terminar. Con el grupo de concurrencia, la corrida nueva
      # queda en cola y arranca apenas esta termina. GitHub si permite que el
      # GITHUB_TOKEN dispare workflow_dispatch (es la excepcion a la regla de
      # que el token no dispara workflows).
      #
      # No se relanza si: la corrida fue cancelada (asi se apaga), fue solo una
      # prueba de avisos, o duro menos de 20 minutos (algo fallo al arrancar; se
      # deja al cron de respaldo para no entrar en un bucle de fallos).
      - name: Relanzar
        if: ${{ !cancelled() && !inputs.probar_avisos }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          duro=$(( $(date +%s) - INICIO_EPOCH ))
          if [ "$duro" -lt 1200 ]; then
            echo "::warning::duro solo ${duro}s; no se relanza (lo retoma el cron de respaldo)"
            exit 0
          fi
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/dian.yml/dispatches" \
            -f ref="${{ github.ref_name }}"
          echo "relanzada"
